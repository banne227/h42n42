<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>H42N42</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.9), transparent 42%),
          linear-gradient(135deg, #e8f0f4 0%, #f6f2ec 100%);
      }

      #controls {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 12px 14px;
        color: #24323b;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 10px;
        box-shadow: 0 5px 18px rgba(36, 50, 59, 0.12);
        backdrop-filter: blur(6px);
        font-size: 13px;
        line-height: 1.8;
      }

      #controls label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      #controls input {
        accent-color: #327d65;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label>Délai reproduction (s)
        <input id="spawn" type="range" min="1" max="10" step="0.5" value="3" />
      </label><br/>
      <label>Taux de contamination (%)
        <input id="contam" type="range" min="0" max="20" step="1" value="2" />
      </label>
      <label>Temps avant de mourrir(s)
        <input id="death" type="range" min="0" max="20" step="1" value="15" />
      </label>
    </div>
    <script src="main.bc.js"></script>
  </body>
</html>
